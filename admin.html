<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <title>GDZ Restaurant | Yönetim Paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <style>#newProductGroup,#newProductGroup option{color:#f4e6cb!important;background:#100708!important;font-family:Montserrat,Arial,sans-serif!important;font-size:12px!important;font-weight:700!important}#newProductGroup{min-height:46px}.product-image-field{grid-column:2/-1;display:grid;grid-template-columns:74px 1fr;align-items:center;gap:8px}.product-image-field span{color:#cda85d;font:700 8px Montserrat,sans-serif;letter-spacing:.08em}.product-image-field input{min-width:0}@media(max-width:820px){.product-image-field{grid-column:2/-1;grid-template-columns:62px 1fr}}</style>
</head>
<body>
  <section class="login-screen" id="loginScreen">
    <form class="login-card" id="loginForm">
      <img src="image/gdz-logo-transparent.png" alt="GDZ Restaurant">
      <span>YÖNETİM SİSTEMİ</span>
      <h1>Admin Girişi</h1>
      <p>Menü içeriklerini güvenli biçimde yönetin.</p>
      <label>E-posta<input id="email" type="email" autocomplete="username" required></label>
      <label>Şifre<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Giriş Yap</button>
      <div class="form-message" id="loginMessage"></div>
    </form>
  </section>

  <div class="dashboard" id="dashboard" hidden>
    <header class="admin-header">
      <div class="admin-brand"><img src="image/gdz-logo-transparent.png" alt=""><div><strong>GDZ RESTAURANT</strong><small>MENÜ YÖNETİMİ</small></div></div>
      <div class="header-actions"><a href="index.html" target="_blank">Menüyü Gör</a><button id="logoutButton" type="button">Çıkış</button></div>
    </header>

    <main class="admin-main">
      <section class="overview">
        <div><small>KATEGORİ</small><strong id="categoryCount">0</strong></div>
        <div><small>ÜRÜN</small><strong id="productCount">0</strong></div>
        <div><small>DURUM</small><strong class="online">CANLI</strong></div>
      </section>

      <section class="toolbar">
        <div><span>Kategori seçimi</span><select id="categorySelect"></select></div>
        <button id="addCategoryButton" type="button">+ Yeni Kategori</button>
      </section>

      <section class="category-editor" id="categoryEditor">
        <div class="section-head"><div><span>SEÇİLİ KATEGORİ</span><h2 id="categoryHeading">—</h2></div><button class="danger ghost" id="deleteCategoryButton" type="button">Kategoriyi Sil</button></div>
        <div class="category-fields">
          <label>Kategori adı<input id="categoryTitle" type="text"></label>
          <label>Kapak görsel yolu<input id="categoryImage" type="text" placeholder="image/ornek.webp"></label>
          <button id="saveCategoryButton" type="button">Kategoriyi Kaydet</button>
        </div>
      </section>

      <section class="products-section">
        <div class="section-head"><div><span>ÜRÜN YÖNETİMİ</span><h2>Menü Ürünleri</h2></div><button id="addProductButton" type="button">+ Yeni Ürün</button></div>
        <div class="products" id="products"></div>
      </section>
    </main>
  </div>

  <div class="modal" id="categoryModal" hidden>
    <form class="modal-card" id="categoryForm"><button class="modal-close" type="button" data-close>×</button><span>YENİ KATEGORİ</span><h2>Kategori oluştur</h2><label>Kategori adı<input id="newCategoryTitle" required></label><label>Kapak görsel yolu<input id="newCategoryImage" value="image/ana.webp" required></label><button type="submit">Kategoriyi Ekle</button></form>
  </div>

  <div class="modal" id="productModal" hidden>
    <form class="modal-card" id="productForm"><button class="modal-close" type="button" data-close>×</button><span>YENİ ÜRÜN</span><h2>Ürün oluştur</h2><label id="groupField" hidden>Alt grup<select id="newProductGroup"></select></label><label>Ürün adı<input id="newProductName" required></label><label>Açıklama<textarea id="newProductDescription" rows="3"></textarea></label><label>Ürün fotoğraf yolu<input id="newProductImage" placeholder="image/urun.webp"></label><label>Kalori bilgisi<input id="newProductCalories" placeholder="≈ 500 kcal"></label><label>Fiyat<input id="newProductPrice" placeholder="₺500" required></label><button type="submit" id="submitProductButton">Ürünü Ekle</button><div class="form-message" id="productMessage"></div></form>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="product-images.js"></script>
  <script src="script.js"></script>
  <script src="admin.js"></script>
</body>
</html>
